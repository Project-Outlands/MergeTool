import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.licenser' version '1.2.0'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'io.github.ben-manes.versions' version '0.67.0'
    id 'net.minecraftforge.gradleutils' version '3.4.11'
    id 'net.minecraftforge.gitversion' version '4.0.1'
}

group = 'top.outlands'
version = gitversion.version
println "Version: $version"

repositories {
    maven {
        name = 'Outlands'
        url = providers.gradleProperty('outlandsRepoUrl').orNull ?: 'https://maven.outlands.top/releases'
    }
    mavenCentral()
    maven gradleutils.forgeReleaseMaven
}

license {
    header = file('LICENSE-header.txt')
    newLine = false
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
}

tasks.register('copyMarkers', Copy).configure  {
    from(configurations.markers.collect { zipTree(it) } ) {
        into 'markers'
        include '**/*.class'
        rename { it.replace('.class', '.marker') }
    }
    includeEmptyDirs = false
    into project.layout.buildDirectory.dir('copyMarkers')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes('Main-Class': 'net.minecraftforge.mergetool.ConsoleMerger')
        attributes('Implementation-Version': project.version)
    }
}

tasks.named('shadowJar', ShadowJar).configure {
    archiveClassifier = 'fatjar'
}

sourceSets {
    main {
        resources {
            srcDirs += [tasks.named('copyMarkers')]
        }
    }
}

configurations {
    markers
}

dependencies {
    implementation(libs.bundles.asm)
    implementation(libs.jopt.simple)
    implementation(libs.srgutils)

    markers "top.outlands:mergetool-cpw:1.0"
    markers "top.outlands:mergetool-fml:1.0"
    markers "top.outlands:mergetool-api:1.0"
    markers "top.outlands:mergetool-neo:1.0"
    markers "top.outlands:mergetool-fabric:1.0"
}

publishing {
    publications.register('mavenJava', MavenPublication) {
        from components.java

        artifactId = 'mergetool'

        pom {
            name = 'MergeTool'
            description = 'Merges two jar files together, useful for rebuilding Retroguard stripped jars.'
            url = 'https://github.com/MinecraftForge/MergeTool'

            gradleutils.pom.addRemoteDetails(pom)

            license gradleutils.pom.licenses.LGPLv2_1

            developers {
                developer gradleutils.pom.developers.LexManos
            }
        }
    }

    repositories {
        maven {
            name = 'Outlands'
            url = 'https://maven.outlands.top/releases'
            credentials {
                username = providers.gradleProperty('outlandsUsername').orNull ?: System.getenv('OUTLANDS_USERNAME')
                password = providers.gradleProperty('outlandsPassword').orNull ?: System.getenv('OUTLANDS_PASSWORD')
            }
        }
    }
}
