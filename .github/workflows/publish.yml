name: Publish MergeTool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Calculate version
        id: version
        run: |
          version="$(./gradlew properties --property version --no-daemon --quiet | sed -n 's/^version: //p')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Publish to Maven
        run: ./gradlew :publish --no-daemon --no-configuration-cache
        env:
          OUTLANDS_USERNAME: ${{ secrets.OUTLANDS_MAVEN_USER }}
          OUTLANDS_PASSWORD: ${{ secrets.OUTLANDS_MAVEN_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MergeTool ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: build/libs/*.jar
          fail_on_unmatched_files: true

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: mergetool
          path: build/libs/*.jar
          if-no-files-found: error
